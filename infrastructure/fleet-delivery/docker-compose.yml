name: bms-fleet-delivery-dev

services:
  postgres:
    build:
      context: ../..
      dockerfile: infrastructure/fleet-delivery/postgres/Dockerfile
    image: bms-fleet-delivery-postgis:16
    environment:
      POSTGRES_DB: ${FLEET_DELIVERY_POSTGRES_DB:?missing}
      POSTGRES_USER: ${FLEET_DELIVERY_POSTGRES_OWNER:?missing}
      POSTGRES_PASSWORD: ${FLEET_DELIVERY_POSTGRES_OWNER_PASSWORD:?missing}
      FLEET_DELIVERY_APP_DB_PASSWORD: ${FLEET_DELIVERY_APP_DB_PASSWORD:?missing}
      FLEET_DELIVERY_WORKER_DB_PASSWORD: ${FLEET_DELIVERY_WORKER_DB_PASSWORD:?missing}
    ports:
      - "127.0.0.1:${FLEET_DELIVERY_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - fleet_delivery_pgdata:/var/lib/postgresql/data
      - ./postgres/init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${FLEET_DELIVERY_REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - fleet_delivery_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/fleet-delivery/Dockerfile
      target: api
    environment:
      FLEET_DELIVERY_MIGRATION_DATABASE_URL: ${FLEET_DELIVERY_MIGRATION_DATABASE_URL:?missing}
      FLEET_DELIVERY_MIGRATIONS_DIR: /app/migrations
    command: ["node", "dist/fleet-delivery-api/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/fleet-delivery/Dockerfile
      target: api
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: development
      FLEET_DELIVERY_DATABASE_URL: ${FLEET_DELIVERY_DATABASE_URL:?missing}
      FLEET_DELIVERY_REDIS_URL: ${FLEET_DELIVERY_REDIS_URL:?missing}
      FLEET_DELIVERY_API_PORT: ${FLEET_DELIVERY_API_PORT:-4100}
      FLEET_DELIVERY_SHUTDOWN_TIMEOUT_MS: ${FLEET_DELIVERY_SHUTDOWN_TIMEOUT_MS:-15000}
      FLEET_DELIVERY_DB_POOL_MAX: ${FLEET_DELIVERY_DB_POOL_MAX:-10}
      FLEET_DELIVERY_MAX_BODY_BYTES: ${FLEET_DELIVERY_MAX_BODY_BYTES:-65536}
      FLEET_DELIVERY_SERVICE_RATE_LIMIT_PER_MINUTE: ${FLEET_DELIVERY_SERVICE_RATE_LIMIT_PER_MINUTE:-120}
      FLEET_DELIVERY_SERVICE_JWKS_JSON: ${FLEET_DELIVERY_SERVICE_JWKS_JSON:-}
      FLEET_DELIVERY_SERVICE_ISSUER: ${FLEET_DELIVERY_SERVICE_ISSUER:-}
      FLEET_DELIVERY_SERVICE_AUDIENCE: ${FLEET_DELIVERY_SERVICE_AUDIENCE:-fleet-delivery}
    ports:
      - "127.0.0.1:${FLEET_DELIVERY_API_HOST_PORT:-4100}:4100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/fleet-delivery/Dockerfile
      target: worker
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: development
      FLEET_DELIVERY_WORKER_DATABASE_URL: ${FLEET_DELIVERY_WORKER_DATABASE_URL:?missing}
      FLEET_DELIVERY_REDIS_URL: ${FLEET_DELIVERY_REDIS_URL:?missing}
      FLEET_DELIVERY_OUTBOX_POLL_MS: ${FLEET_DELIVERY_OUTBOX_POLL_MS:-500}
      FLEET_DELIVERY_OUTBOX_BATCH_SIZE: ${FLEET_DELIVERY_OUTBOX_BATCH_SIZE:-25}
      FLEET_DELIVERY_OUTBOX_LEASE_SECONDS: ${FLEET_DELIVERY_OUTBOX_LEASE_SECONDS:-30}
      FLEET_DELIVERY_DISPATCH_BATCH_SIZE: ${FLEET_DELIVERY_DISPATCH_BATCH_SIZE:-10}
      FLEET_DELIVERY_DISPATCH_LEASE_SECONDS: ${FLEET_DELIVERY_DISPATCH_LEASE_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s

volumes:
  fleet_delivery_pgdata:
  fleet_delivery_redis:
