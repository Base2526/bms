<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BMS Promo Animatic</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101216;
        --panel: #1a1d23;
        --ink: #f4f7fb;
        --muted: #aab2c0;
        --accent: #31a8d8;
        --accent-2: #61d6a4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 0%, rgba(49, 168, 216, 0.18), transparent 28%),
          linear-gradient(145deg, #0c0f13 0%, var(--bg) 52%, #171816 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        padding: 28px 0;
      }

      .topbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .stage-wrap {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #06080a;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0b0d10;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        background: rgba(26, 29, 35, 0.92);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .script-panel {
        margin-top: 16px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(26, 29, 35, 0.82);
      }

      .script-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .script-head h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .script-list {
        display: grid;
        gap: 8px;
      }

      .script-line {
        display: grid;
        grid-template-columns: 40px 1fr;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        color: #d9e1eb;
        font-size: 15px;
        line-height: 1.6;
      }

      .script-line:first-child {
        border-top: 0;
      }

      .script-no {
        color: var(--accent);
        font-weight: 750;
      }

      button {
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #20252d;
        color: var(--ink);
        padding: 0 14px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #2a303a;
      }

      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: #061017;
        font-weight: 700;
      }

      button.primary:hover {
        background: #4cbbe7;
      }

      .meta {
        min-width: 250px;
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .audio-row {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }

      audio {
        width: 100%;
        height: 34px;
      }

      .progress {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
      }

      .bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      a {
        color: var(--accent-2);
      }

      @media (max-width: 720px) {
        main {
          width: min(100vw, calc(100vw - 16px));
          padding: 12px 0;
        }

        .topbar,
        .controls,
        .script-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .meta {
          text-align: left;
        }

        .script-line {
          grid-template-columns: 32px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <div>
          <h1>BMS Promo Animatic</h1>
          <p class="subtitle">Draft 60s flow: Customer -> AI -> CRM -> Order -> Inventory -> Payment -> Shipping -> Dashboard</p>
        </div>
      </div>

      <section class="stage-wrap" aria-label="BMS storyboard animatic player">
        <canvas id="stage" width="1920" height="1080"></canvas>
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div class="controls">
          <div class="buttons">
            <button id="play" class="primary" type="button">Play</button>
            <button id="playVoice" type="button">Play + Voice</button>
            <button id="restart" type="button">Restart</button>
            <button id="speak" type="button">Speak VO</button>
            <button id="export" type="button">Export WebM</button>
          </div>
          <div id="meta" class="meta">Loading storyboard...</div>
          <div class="audio-row">
            <audio id="voAudio" preload="auto" controls src="voiceover-th.aiff"></audio>
          </div>
        </div>
      </section>

      <section class="script-panel" aria-label="Voiceover script">
        <div class="script-head">
          <h2>Voiceover Script</h2>
          <button id="copyScript" type="button">Copy Script</button>
        </div>
        <div id="scriptList" class="script-list"></div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const bar = document.getElementById("bar");
      const meta = document.getElementById("meta");
      const playButton = document.getElementById("play");
      const playVoiceButton = document.getElementById("playVoice");
      const restartButton = document.getElementById("restart");
      const speakButton = document.getElementById("speak");
      const exportButton = document.getElementById("export");
      const copyScriptButton = document.getElementById("copyScript");
      const scriptList = document.getElementById("scriptList");
      const voAudio = document.getElementById("voAudio");

      const W = canvas.width;
      const H = canvas.height;
      const storyboard = new Image();
      storyboard.src = "storyboard.png";

      const shots = [
        {
          title: "ธุรกิจที่ต้องคุมสต็อก",
          caption: "ร้านอาหาร วัสดุก่อสร้าง ร้านขายยา และบอร์ดเกมคาเฟ่ ต้องคุมของจริงหน้างาน",
          voiceover: "ธุรกิจที่ต้องคุมสต็อกมีหลายแบบ ทั้งร้านอาหาร วัสดุก่อสร้าง ร้านขายยา และบอร์ดเกมคาเฟ่ ทุกแบบมีสินค้า ออเดอร์ เงิน และงานหน้าร้านที่ต้องตรงกัน",
          crop: [0, 0, 384, 512],
          from: 1.02,
          to: 1.16,
          drift: [-20, 0],
        },
        {
          title: "ลูกค้าเข้าหลายช่องทาง",
          caption: "หน้าร้าน แชท เว็บไซต์ จุดขาย การรับของ และการจัดส่ง ควรไหลเข้าแกนเดียว",
          voiceover: "ลูกค้าเข้ามาได้หลายช่องทาง ทั้งหน้าร้าน แชท เว็บไซต์ จุดขาย การรับของ และการจัดส่ง BMS รวมช่องทางเหล่านี้ให้ไหลเข้าแกนเดียว",
          crop: [384, 0, 384, 512],
          from: 1.16,
          to: 1.04,
          drift: [18, -8],
        },
        {
          title: "AI เข้าใจเจตนา",
          caption: "AI ช่วยอ่านคำขอของลูกค้า แต่ไม่แตะฐานข้อมูลเอง",
          voiceover: "BMS ใช้ AI เป็นชั้นเข้าใจเจตนา ลูกค้าถามสินค้า สั่งซื้อ หรือเช็กสถานะ AI อ่านคำขอได้ แต่ไม่แตะฐานข้อมูลเอง",
          crop: [768, 0, 384, 512],
          from: 1.0,
          to: 1.12,
          drift: [0, 0],
        },
        {
          title: "ทำงานผ่านเครื่องมือที่อนุมัติ",
          caption: "ค้นสินค้า ตรวจสต็อก สร้างออเดอร์ และตอบลูกค้าผ่าน tools ที่ควบคุมได้",
          voiceover: "เมื่อต้องทำงานจริง AI ผ่านเครื่องมือที่อนุมัติแล้ว เช่น ค้นสินค้า ตรวจสต็อก สร้างออเดอร์ และตอบจากข้อมูลที่ยืนยันได้",
          crop: [1152, 0, 384, 512],
          from: 1.08,
          to: 1.18,
          drift: [-18, 10],
        },
        {
          title: "แกนกลางของธุรกิจ",
          caption: "ลูกค้า ออเดอร์ สต็อก การชำระเงิน และการส่งของ อิงข้อมูลจริงชุดเดียว",
          voiceover: "แกนกลางของ BMS คือข้อมูลธุรกิจจริง ลูกค้า ออเดอร์ สต็อก การชำระเงิน และการส่งของ ทุกส่วนอิงข้อมูลชุดเดียวกัน",
          crop: [0, 512, 384, 512],
          from: 1.15,
          to: 1.04,
          drift: [14, 0],
        },
        {
          title: "Operation ของแต่ละร้าน",
          caption: "ครัว คลังวัสดุ ร้านขายยา หน้าร้าน และบอร์ดเกมคาเฟ่ ใช้ workflow ของตัวเอง",
          voiceover: "จากแกนเดียวกัน แต่ละธุรกิจใช้ workflow ของตัวเอง ครัว ร้านวัสดุ ร้านขายยา คลังสินค้า หรือบอร์ดเกมคาเฟ่ ทำงานตามบริบทของร้าน",
          crop: [384, 512, 384, 512],
          from: 1.05,
          to: 1.18,
          drift: [-10, -8],
        },
        {
          title: "คนยังคุมรายการสำคัญ",
          caption: "คืนเงิน ยกเลิก ปรับสต็อก หรืออนุมัติรายการเสี่ยง ต้องมีผู้มีสิทธิ์ยืนยัน",
          voiceover: "รายการสำคัญยังต้องมีคนอนุมัติ คืนเงิน ยกเลิก ปรับสต็อก หรือยืนยันเรื่องที่กระทบเงินจริงและของจริง ต้องผ่านผู้มีสิทธิ์",
          crop: [768, 512, 384, 512],
          from: 1.08,
          to: 1.16,
          drift: [0, -8],
        },
        {
          title: "เจ้าของเห็นภาพรวม",
          caption: "ทุกประเภทร้านไหลกลับสู่ dashboard เดียว เพื่อดูยอดขาย สต็อก งานค้าง และตัดสินใจ",
          voiceover: "สุดท้ายเจ้าของเห็นภาพรวมบนแดชบอร์ดเดียว ช่องทางขาย สต็อก ออเดอร์ เงิน และงานค้าง จึงตัดสินใจจากข้อมูลจริงชุดเดียว",
          crop: [1152, 512, 384, 512],
          from: 1.0,
          to: 1.12,
          drift: [-12, 0],
        },
      ];

      const secondsPerShot = 12.71;
      const totalMs = shots.length * secondsPerShot * 1000;
      let startedAt = performance.now();
      let pausedAt = null;
      let playing = true;
      let recording = false;
      let speaking = false;

      function ease(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function wrapText(text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        for (let i = 0; i < words.length; i += 1) {
          const testLine = line ? `${line} ${words[i]}` : words[i];
          if (ctx.measureText(testLine).width > maxWidth && line) {
            ctx.fillText(line, x, y);
            line = words[i];
            y += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, y);
        return y + lineHeight;
      }

      function drawTextBlock(shot, shotIndex, localT) {
        const y = H - 245;
        ctx.save();
        ctx.globalAlpha = Math.min(1, localT / 0.16) * Math.min(1, (1 - localT) / 0.1);
        const gradient = ctx.createLinearGradient(0, y - 120, 0, H);
        gradient.addColorStop(0, "rgba(5, 8, 12, 0)");
        gradient.addColorStop(0.35, "rgba(5, 8, 12, 0.72)");
        gradient.addColorStop(1, "rgba(5, 8, 12, 0.92)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, y - 130, W, H - y + 130);

        ctx.fillStyle = "#31a8d8";
        roundRect(104, y - 8, 66, 44, 7);
        ctx.fill();
        ctx.fillStyle = "#061017";
        ctx.font = "700 26px Inter, system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(String(shotIndex + 1).padStart(2, "0"), 137, y + 22);

        ctx.textAlign = "left";
        ctx.fillStyle = "#f4f7fb";
        ctx.font = "760 54px Inter, system-ui, sans-serif";
        wrapText(shot.title, 194, y + 8, 1520, 58);

        ctx.fillStyle = "#d9e1eb";
        ctx.font = "400 32px Inter, system-ui, sans-serif";
        wrapText(shot.caption, 194, y + 62, 1520, 40);

        ctx.restore();
      }

      function drawFrame(now) {
        if (!playing && pausedAt !== null) {
          now = pausedAt;
        }

        const elapsed = ((now - startedAt) % totalMs + totalMs) % totalMs;
        const shotIndex = Math.min(shots.length - 1, Math.floor(elapsed / (secondsPerShot * 1000)));
        const shot = shots[shotIndex];
        const localMs = elapsed - shotIndex * secondsPerShot * 1000;
        const localT = localMs / (secondsPerShot * 1000);
        const e = ease(localT);

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#080a0d";
        ctx.fillRect(0, 0, W, H);

        const [sx, sy, sw, sh] = shot.crop;
        const panelAspect = sw / sh;
        const baseH = H * 0.95;
        const baseW = baseH * panelAspect;
        const scale = shot.from + (shot.to - shot.from) * e;
        const dw = baseW * scale;
        const dh = baseH * scale;
        const dx = (W - dw) / 2 + shot.drift[0] * e;
        const dy = (H - dh) / 2 + shot.drift[1] * e - 28;

        ctx.save();
        ctx.globalAlpha = 0.36;
        ctx.filter = "blur(16px)";
        ctx.drawImage(storyboard, sx, sy, sw, sh, -50, -50, W + 100, H + 100);
        ctx.restore();

        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
        ctx.shadowBlur = 40;
        ctx.drawImage(storyboard, sx, sy, sw, sh, dx, dy, dw, dh);
        ctx.restore();

        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, W, H);
        drawTextBlock(shot, shotIndex, localT);

        bar.style.width = `${((elapsed / totalMs) * 100).toFixed(2)}%`;
        meta.textContent = `Shot ${shotIndex + 1}/8 · ${Math.ceil((totalMs - elapsed) / 1000)}s remaining`;

        if (playing) {
          requestAnimationFrame(drawFrame);
        }
      }

      function play() {
        if (playing) return;
        playing = true;
        const resumeAt = performance.now();
        startedAt += resumeAt - pausedAt;
        pausedAt = null;
        playButton.textContent = "Pause";
        requestAnimationFrame(drawFrame);
      }

      function pause() {
        if (!playing) return;
        pausedAt = performance.now();
        playing = false;
        voAudio.pause();
        playButton.textContent = "Play";
      }

      async function playFromStart(withVoice) {
        startedAt = performance.now();
        pausedAt = null;
        playing = true;
        playButton.textContent = "Pause";
        if (withVoice) {
          window.speechSynthesis?.cancel();
          voAudio.currentTime = 0;
          await voAudio.play();
        }
        requestAnimationFrame(drawFrame);
      }

      playButton.addEventListener("click", () => {
        playing ? pause() : play();
      });

      restartButton.addEventListener("click", () => {
        voAudio.pause();
        voAudio.currentTime = 0;
        playFromStart(false);
      });

      playVoiceButton.addEventListener("click", () => {
        playFromStart(true);
      });

      function renderScript() {
        scriptList.innerHTML = shots
          .map(
            (shot, index) => `
              <div class="script-line">
                <div class="script-no">${String(index + 1).padStart(2, "0")}</div>
                <div>${shot.voiceover}</div>
              </div>
            `,
          )
          .join("");
      }

      function fullScriptText() {
        return shots
          .map((shot, index) => `${index + 1}. ${shot.voiceover}`)
          .join("\n");
      }

      copyScriptButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(fullScriptText());
        copyScriptButton.textContent = "Copied";
        window.setTimeout(() => {
          copyScriptButton.textContent = "Copy Script";
        }, 1400);
      });

      speakButton.addEventListener("click", () => {
        if (!("speechSynthesis" in window)) {
          meta.textContent = "This browser cannot speak the voiceover script.";
          return;
        }

        if (speaking) {
          window.speechSynthesis.cancel();
          speaking = false;
          speakButton.textContent = "Speak VO";
          return;
        }

        speaking = true;
        speakButton.textContent = "Stop VO";
        const utterance = new SpeechSynthesisUtterance(fullScriptText());
        utterance.lang = "th-TH";
        utterance.rate = 0.92;
        utterance.pitch = 1;
        utterance.onend = () => {
          speaking = false;
          speakButton.textContent = "Speak VO";
        };
        window.speechSynthesis.speak(utterance);
      });

      exportButton.addEventListener("click", async () => {
        if (recording) return;
        if (!("MediaRecorder" in window)) {
          meta.textContent = "This browser cannot export video. Try Chrome, Edge, or Safari 17+.";
          return;
        }

        recording = true;
        exportButton.textContent = "Exporting...";
        exportButton.disabled = true;
        await playFromStart(false);

        const canvasStream = canvas.captureStream(30);
        const stream = new MediaStream([...canvasStream.getVideoTracks()]);
        const exportAudio = new Audio("voiceover-th.aiff");
        exportAudio.crossOrigin = "anonymous";
        const canCaptureAudio =
          typeof exportAudio.captureStream === "function" ||
          typeof exportAudio.mozCaptureStream === "function";
        if (canCaptureAudio) {
          await exportAudio.play();
          const audioStream = exportAudio.captureStream?.() || exportAudio.mozCaptureStream?.();
          audioStream?.getAudioTracks().forEach((track) => stream.addTrack(track));
        }
        const chunks = [];
        const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? "video/webm;codecs=vp9"
          : "video/webm";
        const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
        recorder.ondataavailable = (event) => {
          if (event.data.size) chunks.push(event.data);
        };
        recorder.onstop = () => {
          exportAudio.pause();
          const blob = new Blob(chunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "bms-promo-animatic.webm";
          link.textContent = "Download exported animatic";
          meta.innerHTML = "";
          meta.appendChild(link);
          recording = false;
          exportButton.textContent = "Export WebM";
          exportButton.disabled = false;
        };

        recorder.start();
        requestAnimationFrame(drawFrame);
        window.setTimeout(() => recorder.stop(), totalMs + 300);
      });

      storyboard.onload = () => {
        renderScript();
        playButton.textContent = "Pause";
        requestAnimationFrame(drawFrame);
      };
    </script>
  </body>
</html>
