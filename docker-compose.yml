services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?missing}
      POSTGRES_DB: ${POSTGRES_DB?missing}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    # AOF ต่อคีย์ pub/sub เองไม่กระทบ (ephemeral by nature) แต่ session/cache ที่เพิ่มเข้ามา
    # (lib/redisSession.ts, lib/cache.ts) ควรรอด container restart — เปิด AOF ไว้กันข้อมูลหาย
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"

  ws:
    # base config ใช้ร่วมกัน
    image: node:20-alpine
    working_dir: /app/apps/ws
    environment:
      WS_PORT: "8080"
      WS_PATH: "/graphql"
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: postgres://app:app@postgres:5432/appdb
    depends_on:
      - postgres
      - redis

  web:
    image: node:20-alpine
    working_dir: /app/apps/web
    environment:
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_GRAPHQL_HTTP: ${NEXT_PUBLIC_GRAPHQL_HTTP}
      NEXT_PUBLIC_GRAPHQL_WS: ${NEXT_PUBLIC_GRAPHQL_WS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      STORAGE_DIR: /app/storage
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID}
      NEXT_PUBLIC_FACEBOOK_APP_SECRET: ${NEXT_PUBLIC_FACEBOOK_APP_SECRET}
      NEXT_PUBLIC_SENDGRID_API_KEY: ${NEXT_PUBLIC_SENDGRID_API_KEY}
      NEXT_PUBLIC_SENDGRID_FROM_EMAIL: ${NEXT_PUBLIC_SENDGRID_FROM_EMAIL}
      NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL}
      NEXT_PUBLIC_WEB_NAME: ${WEB_NAME}
      # Mail provider switch (sendgrid ค่า default / gmail = ส่งผ่าน Gmail SMTP แทน) — ดู lib/mailer.ts
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      GMAIL_SMTP_USER: ${GMAIL_SMTP_USER}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD}
      GMAIL_SMTP_FROM_NAME: ${GMAIL_SMTP_FROM_NAME}
      # BMS AI (shared key + model override + cron auth) — ต้องมาจากไฟล์ env ที่ compose ใช้จริง
      # (--env-file .env.prod ทำให้ค่า ${...} นี้ resolve ได้เท่านั้น ไม่ inject เข้า container โดยอัตโนมัติ)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      BMS_AI_MODEL: ${BMS_AI_MODEL}
      BMS_AI_PROVIDER: ${BMS_AI_PROVIDER}
      BMS_AI_SENSITIVE_PROVIDER: ${BMS_AI_SENSITIVE_PROVIDER}
      BMS_AI_HEALTH_STALE_MINUTES: ${BMS_AI_HEALTH_STALE_MINUTES}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      QWEN_OCR_API_KEY: ${QWEN_OCR_API_KEY}
      QWEN_OCR_MODEL: ${QWEN_OCR_MODEL}
      QWEN_OCR_BASE_URL: ${QWEN_OCR_BASE_URL}
      QWEN_OCR_INPUT_USD_PER_MILLION: ${QWEN_OCR_INPUT_USD_PER_MILLION}
      QWEN_OCR_OUTPUT_USD_PER_MILLION: ${QWEN_OCR_OUTPUT_USD_PER_MILLION}
      BMS_SLIP_READER_PROVIDER: ${BMS_SLIP_READER_PROVIDER}
      BMS_SLIP_READER_FALLBACK_PROVIDER: ${BMS_SLIP_READER_FALLBACK_PROVIDER}
      BMS_CRON_SECRET: ${BMS_CRON_SECRET}
      BMS_CHECKOUT_SECRET: ${BMS_CHECKOUT_SECRET:-${JWT_SECRET}}
    depends_on:
      - postgres
      - redis
      - ws

  # เปิดเฉพาะตอนต้องการจริง (dev เต็ม stack): เพิ่ม --profile with-caddy ตอนรัน `docker compose up`
  # ปิด default ไว้ เพราะบน production VM ตัวนี้ (bms.jachoei.com) มี Caddy ของ next-apollo-pg-ws
  # ถือ 80/443 อยู่แล้ว รัน caddy ซ้ำจะชน port (ดู docker-compose.prod.yml/CLAUDE.local.md)
  caddy:
    image: caddy:2-alpine
    # profiles: ["with-caddy"]
    depends_on:
      - web
      - ws
    volumes:
      - ./apps/web/Caddyfile:/etc/caddy/Caddyfile:ro
      # แนะนำให้เก็บ cert/key ไว้ในโฟลเดอร์ certs
      - ./apps/web/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redis_data:
  caddy_data:
  caddy_config:
