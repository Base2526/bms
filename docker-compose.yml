services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?missing}
      POSTGRES_DB: ${POSTGRES_DB?missing}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"

  ws:
    # base config ใช้ร่วมกัน
    image: node:20-alpine
    working_dir: /app/apps/ws
    environment:
      WS_PORT: "8080"
      WS_PATH: "/graphql"
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: postgres://app:app@postgres:5432/appdb
    depends_on:
      - postgres
      - redis

  web:
    image: node:20-alpine
    working_dir: /app/apps/web
    environment:
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_GRAPHQL_HTTP: ${NEXT_PUBLIC_GRAPHQL_HTTP}
      NEXT_PUBLIC_GRAPHQL_WS: ${NEXT_PUBLIC_GRAPHQL_WS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      STORAGE_DIR: /app/storage
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID}
      NEXT_PUBLIC_FACEBOOK_APP_SECRET: ${NEXT_PUBLIC_FACEBOOK_APP_SECRET}
      NEXT_PUBLIC_SENDGRID_API_KEY: ${NEXT_PUBLIC_SENDGRID_API_KEY}
      NEXT_PUBLIC_SENDGRID_FROM_EMAIL: ${NEXT_PUBLIC_SENDGRID_FROM_EMAIL}
      NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL}
      NEXT_PUBLIC_WEB_NAME: ${WEB_NAME}
    depends_on:
      - postgres
      - redis
      - ws

  # เปิดเฉพาะตอนต้องการจริง (dev เต็ม stack): เพิ่ม --profile with-caddy ตอนรัน `docker compose up`
  # ปิด default ไว้ เพราะบน production VM ตัวนี้ (bms.jachoei.com) มี Caddy ของ next-apollo-pg-ws
  # ถือ 80/443 อยู่แล้ว รัน caddy ซ้ำจะชน port (ดู docker-compose.prod.yml/CLAUDE.local.md)
  caddy:
    image: caddy:2-alpine
    # profiles: ["with-caddy"]
    depends_on:
      - web
      - ws
    volumes:
      - ./apps/web/Caddyfile:/etc/caddy/Caddyfile:ro
      # แนะนำให้เก็บ cert/key ไว้ในโฟลเดอร์ certs
      - ./apps/web/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

  social-worker:
    image: node:20-alpine
    # image: myapp-web:latest
    working_dir: /app/apps/web
    environment:
      NODE_ENV: development
      REDIS_URL: ${REDIS_URL}

      # DB (แนะนำใส่ให้ worker ใช้ตรง ๆ)
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Social
      FB_PAGE_ID: ${FB_PAGE_ID}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN}

      SOCIAL_QUEUE_KEY: ${SOCIAL_QUEUE_KEY}
      SOCIAL_DLQ_KEY: ${SOCIAL_DLQ_KEY}
      SOCIAL_DELAYED_KEY: ${SOCIAL_DELAYED_KEY}

    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  caddy_data:
  caddy_config:
