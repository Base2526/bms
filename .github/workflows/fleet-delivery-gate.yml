name: Fleet Delivery Gate

on:
  pull_request:
    paths:
      - "apps/fleet-delivery-*/**"
      - "packages/fleet-delivery-*/**"
      - "infrastructure/fleet-delivery/**"
      - "docs/delivery/**"
      - "scripts/fleet-delivery-*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.fleet-delivery.json"
      - "tsup.fleet-delivery.config.ts"
      - ".github/workflows/fleet-delivery-gate.yml"
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: fleet-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-15
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/fleet-delivery-customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: apps/fleet-delivery-customer/package-lock.json
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        if: matrix.platform == 'ios'
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/fleet-delivery-driver
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - name: Build Android debug and unsigned release applications
        if: matrix.platform == 'android'
        run: npm run android:assemble
      - name: Install iOS pods using the shared mobile Ruby lock
        if: matrix.platform == 'ios'
        working-directory: apps/fleet-delivery-driver
        run: bundle exec pod install --project-directory=../fleet-delivery-customer/ios
      - name: Build locally signed iOS Debug simulator application
        if: matrix.platform == 'ios'
        run: npm run ios:build
      - name: Verify the built platform boundary
        run: npm run verify:native-boundary -- ${{ matrix.platform }}

  driver-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/fleet-delivery-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: apps/fleet-delivery-driver/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run lint
      - run: npm run verify:security-patch
      - run: npm run verify:supply-chain
      - run: npm run verify:audit-boundary
      - run: npm run verify:device-safety
      - run: npm run verify:licenses
      - run: npm run verify:reproducibility
      - name: Build Android debug and unsigned release applications
        run: ./gradlew assembleDebug assembleRelease
        working-directory: apps/fleet-delivery-driver/android

  driver-mobile-ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/fleet-delivery-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: apps/fleet-delivery-driver/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/fleet-delivery-driver
      - run: npm ci
      - run: npm run verify:security-patch
      - run: npm run verify:device-safety
      - run: bundle exec pod install --project-directory=ios
      - name: Build locally signed iOS Debug simulator application
        run: npm run ios:build
      - name: Build unsigned iOS Release simulator application
        run: >-
          xcodebuild -workspace ios/BmsDeliveryDriver.xcworkspace
          -scheme BmsDeliveryDriver -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_delivery_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fleet_delivery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FLEET_DELIVERY_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/fleet_delivery_test
      FLEET_DELIVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/fleet_delivery_test
      FLEET_DELIVERY_REDIS_URL: redis://127.0.0.1:56379
      FLEET_DELIVERY_TEST_REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run certification:verify
      - run: npm run approval-requests:verify
      - run: npm run launch-controls:verify
      - run: npm run config:verify
      - run: npm run api-contract:verify
      - run: npm run secret-scan:verify
      - run: npm run license:verify
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run gate
      - run: npm run reproducibility:verify
      - run: npm run migrate
      - run: npm run migrate
      - run: npm run test:db
      - name: Validate Compose configuration
        working-directory: infrastructure/fleet-delivery
        env:
          FLEET_DELIVERY_POSTGRES_DB: fleet_delivery
          FLEET_DELIVERY_POSTGRES_OWNER: fleet_delivery_owner
          FLEET_DELIVERY_POSTGRES_OWNER_PASSWORD: local-owner
          FLEET_DELIVERY_APP_DB_PASSWORD: local-app
          FLEET_DELIVERY_WORKER_DB_PASSWORD: local-worker
          FLEET_DELIVERY_MIGRATION_DATABASE_URL: postgresql://fleet_delivery_owner:local-owner@postgres:5432/fleet_delivery
          FLEET_DELIVERY_DATABASE_URL: postgresql://fleet_delivery_app:local-app@postgres:5432/fleet_delivery
          FLEET_DELIVERY_WORKER_DATABASE_URL: postgresql://fleet_delivery_worker:local-worker@postgres:5432/fleet_delivery
          FLEET_DELIVERY_REDIS_URL: redis://redis:6379
        run: docker compose config --quiet
