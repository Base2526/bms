name: Desktop Windows package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches:
      - develop
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run desktop unit tests
        run: npm test

      - name: Check desktop sources
        run: npm run lint

      - name: Build NSIS installer
        run: npm run pack:win

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: bms-pos-windows-${{ github.sha }}
          if-no-files-found: error
          path: apps/desktop/dist/*.exe
          retention-days: 14
