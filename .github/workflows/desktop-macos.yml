name: Desktop macOS package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-macos.yml"
  push:
    branches:
      - develop
      - feat/macos-pos-client
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-macos.yml"

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run desktop unit tests
        run: npm test

      - name: Check desktop sources
        run: npm run lint

      - name: Smoke-test the Electron setup screen
        run: npm run test:smoke

      - name: Build Intel and Apple Silicon DMGs
        run: npm run pack:mac

      - name: Upload unsigned macOS disk images
        uses: actions/upload-artifact@v4
        with:
          name: bms-pos-macos-${{ github.sha }}
          if-no-files-found: error
          path: apps/desktop/dist/*.dmg
          retention-days: 14
