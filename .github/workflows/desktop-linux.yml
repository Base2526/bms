name: Desktop Linux package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-linux.yml"
  push:
    branches:
      - develop
      - feat/linux-pos-client
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-linux.yml"

permissions:
  contents: read

jobs:
  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run desktop unit tests
        run: npm test

      - name: Check desktop sources
        run: npm run lint

      - name: Smoke-test the Electron setup screen
        run: xvfb-run -a npm run test:smoke

      - name: Upload setup smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bms-pos-linux-smoke-${{ github.sha }}
          if-no-files-found: warn
          path: apps/desktop/dist-smoke/*.png
          retention-days: 14

      - name: Build AppImage and DEB
        run: npm run pack:linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: bms-pos-linux-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          retention-days: 14
