apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bms.delivery.customer"
    defaultConfig {
        applicationId "com.bms.delivery.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            manifestPlaceholders.rideGoogleMapsKey = System.getenv("BMS_GOOGLE_MAPS_ANDROID_API_KEY") ?: ""
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Metro watchFolders are outside this app root; Gradle must invalidate bundles for them too.
tasks.configureEach { task ->
    if (task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets")) {
        task.inputs.files(fileTree("../../../fleet-delivery-customer-core") {
            include "src/**/*.ts", "native/**/*.tsx"
            exclude "**/*.test.ts"
        })
        task.inputs.files(fileTree("../../../../packages/fleet-delivery-contracts/src") {
            include "**/*.ts"
            exclude "**/*.test.ts"
        })
    }
}
