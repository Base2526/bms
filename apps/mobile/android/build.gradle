buildscript {
    ext {
        buildToolsVersion = "36.1.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.0.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// SDK CMake 3.22.1 ships Ninja 1.10.2, whose Windows path handling can report an
// existing Nitro prefab config as missing when its unnormalized path exceeds 260
// characters, causing endless CMake regeneration. Keep scanner staging out of the
// deep node_modules path; this is build metadata only, not a dependency-source patch.
if (System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")) {
    subprojects { subproject ->
        if (subproject.name == "react-native-data-scanner") {
            subproject.plugins.withId("com.android.library") {
                subproject.android.externalNativeBuild.cmake.buildStagingDirectory =
                    rootProject.file(".cxx/scanner")
            }
        }
    }
}
