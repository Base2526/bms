fragment MobileRealtimeEventFields on RealtimeEvent {
  eventId
  eventType
  schemaVersion
  tenantId
  locationId
  userId
  actorType
  actorId
  deviceId
  entityType
  entityId
  aggregateVersion
  updatedAt
  occurredAt
  payload
}

query PosBootstrap {
  bmsPosSession {
    device {
      id
      code
      name
      registeredPosNo
      scanner {
        mode
        prefixKey
        suffixKey
        maxGapMs
      }
    }
    location {
      id
      name
      branchCode
      vatCode
      pharmacistName
    }
    shift {
      id
      locationId
      deviceId
      status
      openedBy
      openedAt
      openingFloat
      countedCash
      expectedCash
      cashVariance
      closedAt
      pharmacistUserId
    }
    shiftReturnSummary {
      returnCount
      returnTotal
      settledTotal
      pendingTotal
      pendingCount
    }
    cashiers {
      id
      name
      email
      role
      isPharmacist
      hasPin
      posOnly
    }
    purchaseReceivers {
      id
      name
      role
      hasPin
    }
    approvers {
      id
      name
      role
      isPharmacist
      hasPin
      approvals
    }
    kitchenOperators {
      id
      name
      role
      hasPin
    }
    store {
      taxId
      receiptLanguageMode
    }
    surface
    businessArchetype
    vat {
      registered
      priceIncludesVat
      rate
      calendarEra
      cashRounding
    }
  }
}

mutation VerifyPosCashier($input: BmsPosCredentialsInput!) {
  bmsPosVerifyCashier(input: $input) {
    id
    name
    email
    role
    isPharmacist
    hasPin
    posOnly
  }
}

fragment MobilePosReceiptFields on BmsPosReceipt {
  orderId
  receiptNo
  billNo
  soldAt
  total
  orderStatus
  locationName
  branchCode
  cashierName
  memberName
  memberNo
  sourceChannel
  paymentMethod
  paymentRef
  cashTendered
  cashChange
  returnEligible
  returnBlockedReason
  voidedAt
  roundingAmount
  lines {
    orderItemId
    sku
    size
    receiptName
    packCode
    unitName
    packQty
    packPrice
    baseQty
    lineTotal
    refundablePackQty
    returnedPackQty
  }
  payments {
    id
    method
    amount
    ref
    cashTendered
    cashChange
  }
  refunds {
    id
    method
    amount
    completedAt
    externalRef
  }
  returnEvents {
    id
    isVoid
    note
    refundAmount
    returnedAt
    returnedByName
    approvedByName
    settlementStatus
    items {
      orderItemId
      sku
      size
      receiptName
      packQty
      refundAmount
    }
    refunds {
      id
      method
      amount
      completedAt
      externalRef
      paymentId
    }
  }
  discountLines {
    label
    amount
  }
  vat {
    rate
    taxableAmount
    exemptAmount
    netBeforeVat
    vatAmount
    roundingAmount
  }
}

fragment MobileRestaurantCheckFields on BmsPosRestaurantCheck {
  id
  tableId
  tableCode
  tableName
  areaName
  status
  version
  guestCount
  amountDue
  openedAt
  reservationStatus
  reservationLost
  items {
    id
    sku
    size
    productName
    packCode
    unitName
    packQty
    packPrice
    baseQty
    lineAmount
    status
    kitchenStatus
    kitchenNote
    modifierCodes
    modifierNames
    roundNo
    sentAt
  }
}

fragment MobileKitchenTicketFields on BmsKitchenTicket {
  id
  checkId
  orderId
  orderItemId
  source
  tableCode
  tableName
  roundNo
  station
  stationId
  status
  productSku
  productName
  size
  qty
  packQty
  modifierCodes
  kitchenNote
  createdAt
  updatedAt
}

query MobilePosCatalog($q: String = "") {
  bmsPosCatalogSearch(q: $q) {
    items {
      sku
      name
      price
      availability
      availableTotal
      imageUrl
      availableSizes {
        size
        available
        price
      }
    }
  }
}

query MobilePosScan($code: String!) {
  bmsPosScan(code: $code, surface: "POS", withImage: true) {
    sku
    size
    productName
    receiptName
    baseQty
    packCode
    unitName
    packPrice
    basePrice
    available
    serialTracked
    scaleBarcode
    imageUrl
    modifierCodes: modifiers {
      code
    }
  }
}

query MobilePosSales($q: String, $limit: Int = 50) {
  bmsPosRecentSales(q: $q, limit: $limit, deviceOnly: false) {
    sales {
      ...MobilePosReceiptFields
    }
  }
}

query MobilePosLastSale {
  bmsPosLastSale {
    ...MobilePosReceiptFields
  }
}

query MobilePosParkedSales {
  bmsPosParkedSales {
    parked {
      id
      label
      createdAt
      itemCount
      subtotalHint
      parkedByName
      cart {
        version
        couponCode
        pointsToRedeem
        member {
          customerId
          memberNo
          name
          phone
          pointsBalance
          pointsUsable
        }
        lines {
          key
          sku
          size
          productName
          receiptName
          packCode
          unitName
          packQty
          packPrice
          basePrice
          baseQty
          available
          imageUrl
          modifierCodes
          serialTracked
          scaleBarcode
          serials
        }
      }
    }
  }
}

query MobilePosMembers($q: String, $amount: Float) {
  bmsPosMemberSearch(q: $q, amount: $amount) {
    members {
      customerId
      memberNo
      name
      phone
      pointsBalance
      pointsUsable
      memberSince
      tier {
        id
        code
        name
        discountType
        discountValue
      }
    }
    loyalty {
      enabled
      block
      pointsForAmount
    }
  }
}

query MobilePosMemberPreview($input: BmsPosMemberPreviewInput!) {
  bmsPosMemberPreview(input: $input) {
    status
    reason
    subtotal
    netTotal
    totalDiscount
    tierDiscount
    tierLabel
    couponDiscount
    couponError
    manualDiscount
    pointsDiscount
    pointsUsed
    pointsWillEarn
    pointsBalance: cappedAt
    member {
      customerId
      memberNo
      name
      phone
      pointsBalance
      pointsUsable
      tier {
        id
        code
        name
        discountType
        discountValue
      }
    }
  }
}

query MobilePosCashMovements {
  bmsPosCashMovements {
    movements {
      id
      direction
      amount
      reason
      actorName
      approvedByName
      createdAt
    }
  }
}

query MobilePosShiftReport(
  $credentials: BmsPosCredentialsInput!
  $shiftId: ID!
) {
  bmsPosShiftReport(credentials: $credentials, shiftId: $shiftId) {
    report {
      shiftId
      status
      openedAt
      openedByName
      openingFloat
      closedAt
      closedByName
      salesTotal
      billCount
      discountTotal
      returnTotal
      returnCount
      voidTotal
      voidCount
      cashIn
      cashOut
      cashRefunds
      expectedCash
      expectedCashHidden
      countedCash
      cashVariance
      roundingTotal
      byMethod {
        method
        amount
        count
      }
      byCashier {
        cashier
        amount
        billCount
      }
    }
  }
}

query MobilePosShiftHistory($credentials: BmsPosCredentialsInput!) {
  bmsPosShiftHistory(credentials: $credentials) {
    shifts {
      id
      status
      openedAt
      openedByName
      closedAt
      closedByName
      expectedCash
      countedCash
      cashVariance
    }
  }
}

query MobileRestaurantFloor {
  bmsPosRestaurantFloor {
    areas {
      id
      name
    }
    tables {
      id
      areaId
      code
      name
      seats
      status
      active
      blocked
      shape
      positionX
      positionY
      check {
        id
        status
        version
        itemCount
        unsentCount
        amountDue
        guestCount
        openedAt
      }
      checks {
        id
        status
        version
        itemCount
        unsentCount
        amountDue
        guestCount
        openedAt
      }
    }
  }
}

query MobileRestaurantMenu {
  bmsPosRestaurantMenu {
    items {
      sku
      name
      price
      sellable
      availability
      availableTotal
      imageUrl
      kitchenStation
      kitchenStationId
      hasModifiers
      unavailableReason
      unavailableResetsAt
      availableSizes {
        size
        available
      }
    }
  }
}

query MobileRestaurantCheck($id: ID!) {
  bmsPosRestaurantCheck(id: $id) {
    ...MobileRestaurantCheckFields
  }
}

query MobileKitchenTickets($status: String) {
  bmsPosKitchenTickets(status: $status, limit: 100) {
    generatedAt
    stations {
      id
      name
      sortOrder
    }
    stationSlas {
      stationRef
      warnMinutes
      lateMinutes
    }
    tickets {
      ...MobileKitchenTicketFields
    }
  }
}

query MobileRestaurantIncoming {
  bmsPosRestaurantIncoming {
    config {
      accepting
      paused
      reason
      hours {
        day
        open
        close
      }
    }
    orders {
      id
      channel
      customerRef
      status
      fulfillmentType
      createdAt
      promisedAt
      amountDue
      items {
        orderItemId
        sku
        size
        name
        unitName
        qty
        modifierCodes
      }
    }
    refunds {
      id
      orderId
      method
      amount
      channel
      customerRef
      createdAt
      cancelledBy
    }
  }
}

mutation MobilePosSale($input: BmsPosSaleInput!) {
  bmsPosSale(input: $input) {
    status
    reason
    orderId
    receiptNo
    billNo
    subtotal
    discount
    total
    cashTendered
    cashChange
    pointsUsed
    pointsEarned
    pointsBalance
    replayed
  }
}

mutation MobilePosReturn($input: BmsPosReturnInput!) {
  bmsPosReturn(input: $input) {
    status
    reason
    orderId
    posReturnId
    refundAmount
    settlementStatus
    creditNoteNo
    replayed
  }
}

mutation MobilePosVoid($input: BmsPosVoidInput!) {
  bmsPosVoid(input: $input) {
    status
    reason
    orderId
    posReturnId
    refundAmount
    settlementStatus
    creditNoteNo
    replayed
  }
}

mutation MobilePosShift($input: BmsPosShiftInput!) {
  bmsPosShift(input: $input) {
    status
    reason
    shift {
      id
      locationId
      deviceId
      status
      openedBy
      openedAt
      openingFloat
      countedCash
      expectedCash
      cashVariance
      closedAt
      pharmacistUserId
    }
  }
}

mutation MobilePosCashMovement($input: BmsPosCashMovementInput!) {
  bmsPosCashMovement(input: $input) {
    status
    reason
    replayed
    drawerAfter
    available
    movement {
      id
      direction
      amount
      reason
      actorName
      approvedByName
      createdAt
    }
  }
}

mutation MobilePosPark($input: BmsPosParkInput!) {
  bmsPosPark(input: $input) {
    status
    reason
    label
    parked {
      id
      label
      createdAt
      itemCount
      subtotalHint
    }
  }
}

mutation MobileRestaurantOpenCheck($input: BmsPosRestaurantOpenCheckInput!) {
  bmsPosRestaurantOpenCheck(input: $input) {
    check {
      ...MobileRestaurantCheckFields
    }
  }
}

mutation MobileRestaurantAddCheckItem(
  $checkId: ID!
  $input: BmsPosRestaurantAddCheckItemInput!
) {
  bmsPosRestaurantAddCheckItem(checkId: $checkId, input: $input) {
    status
    reason
    available
    expected
    requested
    check {
      ...MobileRestaurantCheckFields
    }
  }
}

mutation MobileRestaurantRemoveCheckItem(
  $checkId: ID!
  $itemId: ID!
  $credentials: BmsPosRestaurantCheckCredentialsInput!
) {
  bmsPosRestaurantRemoveCheckItem(
    checkId: $checkId
    itemId: $itemId
    credentials: $credentials
  ) {
    status
    reason
    check {
      ...MobileRestaurantCheckFields
    }
  }
}

mutation MobileRestaurantSendCheck(
  $checkId: ID!
  $credentials: BmsPosRestaurantCheckCredentialsInput!
) {
  bmsPosRestaurantSendCheckToKitchen(
    checkId: $checkId
    credentials: $credentials
  ) {
    status
    reason
    kitchenTickets
    check {
      ...MobileRestaurantCheckFields
    }
  }
}

mutation MobileRestaurantSettleCheck(
  $checkId: ID!
  $input: BmsPosRestaurantSettleCheckInput!
) {
  bmsPosRestaurantSettleCheck(checkId: $checkId, input: $input) {
    status
    reason
    orderId
    receiptNo
    billNo
    total
    cashTendered
    cashChange
    replayed
    check {
      ...MobileRestaurantCheckFields
    }
  }
}

mutation MobileKitchenTicketStatus($input: BmsPosKitchenTicketStatusInput!) {
  bmsPosKitchenTicketStatus(input: $input) {
    status
    reason
    ticket {
      ...MobileKitchenTicketFields
    }
  }
}

mutation MobileRestaurantAcceptIncoming(
  $input: BmsPosRestaurantAcceptIncomingOrderInput!
) {
  bmsPosRestaurantAcceptIncomingOrder(input: $input) {
    status
    reason
    ticketsCreated
    replayed
  }
}

