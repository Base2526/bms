query MobilePosScan(
  $code: String!
  $size: String
  $packCode: String
  $surface: String = "RETAIL_POS"
) {
  bmsPosScan(
    code: $code
    size: $size
    packCode: $packCode
    surface: $surface
    withImage: true
  ) {
    sku
    size
    productName
    receiptName
    baseQty
    packCode
    unitName
    packPrice
    basePrice
    available
    serialTracked
    scaleBarcode
    imageUrl
    # ราคาส่ง (8.1) และโปร (8.7) — เครื่องขายต้องพรีวิวยอดด้วยกฎเดียวกับ createOrder
    # ไม่งั้นยอดที่ส่งไปไม่ตรงกับที่ server คิด แล้วบิลถูกทิ้งทั้งใบ (PAYMENT_MISMATCH)
    priceTiers {
      minQty
      scope
      size
      unitPrice
      discountPct
    }
    promotion {
      kind
      buyQty
      getQty
      bundlePrice
    }
    modifiers {
      code
      name
      priceDelta
      groupCode
      groupName
      selectionType
      minSelect
      maxSelect
      defaultSelected
    }
    packs {
      code
      unitName
      baseQty
      price
    }
  }
}

