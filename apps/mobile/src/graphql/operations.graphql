query MobilePosMemberPreview($input: BmsPosMemberPreviewInput!) {
  bmsPosMemberPreview(input: $input) {
    status
    reason
    subtotal
    amountDue
    grossAmountDue
    reservationDepositApplied
    netTotal
    totalDiscount
    tierDiscount
    tierLabel
    couponDiscount
    couponError
    manualDiscount
    pointsDiscount
    pointsUsed
    pointsWillEarn
    # อัตราแลกแต้มของร้าน — จอต้องปัดจำนวนแต้มเป็นก้าวละหน่วยแลกก่อนส่ง
    # ไม่งั้น createOrder ปฏิเสธทั้งบิลด้วย POINTS_INVALID (pointsUsed ต้องเท่าที่ขอเป๊ะ)
    redeemPointsPerUnit
    redeemMinPoints
    redeemBahtPerUnit
    pointsBalance: cappedAt
    member {
      customerId
      memberNo
      name
      phone
      pointsBalance
      pointsUsable
      tier {
        id
        code
        name
        discountType
        discountValue
      }
    }
  }
}

