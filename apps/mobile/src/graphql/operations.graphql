query MobilePosScan(
  $code: String!
  $size: String
  $packCode: String
  $surface: String = "RETAIL_POS"
) {
  bmsPosScan(
    code: $code
    size: $size
    packCode: $packCode
    surface: $surface
    withImage: true
  ) {
    sku
    size
    productName
    receiptName
    baseQty
    packCode
    unitName
    packPrice
    basePrice
    available
    serialTracked
    scaleBarcode
    imageUrl
