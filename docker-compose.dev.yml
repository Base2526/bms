services:
  ws:
    command: >
      sh -c "npm ci &&
             npm --prefix ../../packages/realtime ci &&
             npm --prefix ../../packages/graphql-core ci &&
             npm run dev"
    environment:
      NODE_ENV: development
    ports:
      - "8081:8080"
    volumes:
      - ./apps/ws:/app/apps/ws
      - ./packages:/app/packages

  web:
    command: >
      sh -c "npm ci && 
             npm --prefix ../../packages/social-queue ci &&
             npm run dev"
    environment:
      NODE_ENV: development
      COOKIE_SECURE: ${COOKIE_SECURE}
      DEBUG_LOG: ${DEBUG_LOG}
      DB_LOG: ${DB_LOG}
      DB_LOG_LEVELS: ${DB_LOG_LEVELS}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      # BMS
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BMS_AI_MODEL: ${BMS_AI_MODEL}
      BMS_CRON_SECRET: ${BMS_CRON_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./storage:/app/storage

  caddy:
    ports:
      - "443:443"

  social-worker:
    # command: >
    #   sh -c "npm ci &&
    #          npm --prefix ../../packages/social-queue ci &&
    #          npm run worker:social"
    # command: npm run worker:social
    working_dir: /app/apps/web
    command: sh -c "npm ci && npm run worker:social"
    volumes:
      - .:/app
      - /app/apps/web/node_modules
