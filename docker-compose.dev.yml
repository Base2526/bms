services:
  ws:
    command: >
      sh -c "test -f node_modules/.package-lock.json || npm ci &&
             test -f ../../packages/realtime/node_modules/.package-lock.json || npm --prefix ../../packages/realtime ci &&
             test -f ../../packages/graphql-core/node_modules/.package-lock.json || npm --prefix ../../packages/graphql-core ci &&
             npm run dev"
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-100}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-10}
      WS_MAX_CONNECTIONS_PER_TENANT: ${WS_MAX_CONNECTIONS_PER_TENANT:-1000}
      WS_MAX_SUBSCRIPTIONS_PER_CONNECTION: ${WS_MAX_SUBSCRIPTIONS_PER_CONNECTION:-20}
      WS_CONNECTION_INIT_TIMEOUT_MS: ${WS_CONNECTION_INIT_TIMEOUT_MS:-10000}
      WS_IDLE_TIMEOUT_MS: ${WS_IDLE_TIMEOUT_MS:-90000}
      WS_PING_INTERVAL_MS: ${WS_PING_INTERVAL_MS:-25000}
      WS_AUTH_RECHECK_MS: ${WS_AUTH_RECHECK_MS:-15000}
      WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES:-65536}
      WS_MAX_QUERY_BYTES: ${WS_MAX_QUERY_BYTES:-16384}
      WS_MAX_VARIABLES_BYTES: ${WS_MAX_VARIABLES_BYTES:-16384}
      WS_MAX_BUFFERED_BYTES: ${WS_MAX_BUFFERED_BYTES:-1048576}
      REALTIME_SUBSCRIPTIONS_ENABLED: ${REALTIME_SUBSCRIPTIONS_ENABLED:-0}
      REALTIME_ORDERS_ENABLED: ${REALTIME_ORDERS_ENABLED:-1}
      REALTIME_RESTAURANT_ENABLED: ${REALTIME_RESTAURANT_ENABLED:-1}
      REALTIME_INVENTORY_ENABLED: ${REALTIME_INVENTORY_ENABLED:-1}
      REALTIME_PAYMENTS_ENABLED: ${REALTIME_PAYMENTS_ENABLED:-1}
      REALTIME_INBOX_ENABLED: ${REALTIME_INBOX_ENABLED:-1}
      REALTIME_SHIPPING_ENABLED: ${REALTIME_SHIPPING_ENABLED:-1}
      REALTIME_PHARMACY_ENABLED: ${REALTIME_PHARMACY_ENABLED:-1}
      REALTIME_ADMIN_ENABLED: ${REALTIME_ADMIN_ENABLED:-1}
      REALTIME_POS_ENABLED: ${REALTIME_POS_ENABLED:-1}
    ports:
      - "8081:8080"
    volumes:
      - ./apps/ws:/app/apps/ws
      - ./packages:/app/packages

  web:
    command: >
      sh -c "test -f node_modules/.package-lock.json || npm ci &&
             npm run dev"
    environment:
      NODE_ENV: development
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-${NEXT_PUBLIC_FACEBOOK_APP_SECRET}}
      COOKIE_SECURE: ${COOKIE_SECURE}
      DEBUG_LOG: ${DEBUG_LOG}
      DB_LOG: ${DB_LOG}
      DB_LOG_LEVELS: ${DB_LOG_LEVELS}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      # BMS
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BMS_AI_MODEL: ${BMS_AI_MODEL}
      # ความลับที่โค้ดต้องใช้ตอน runtime — ต้องอยู่ใน environment: ไม่ใช่แค่ใน .env
      # (compose ส่งเข้า container เฉพาะตัวที่ระบุที่นี่ · --env-file ไม่ inject ให้)
      # ไม่ตั้ง = production throw ตั้งใจ ดู lib/auth/token.ts และ lib/bms/crypto.ts
      JWT_SECRET: ${JWT_SECRET}
      BMS_SECRET_KEY: ${BMS_SECRET_KEY}
      BMS_CRON_SECRET: ${BMS_CRON_SECRET}
      BMS_JOB_TOKEN: ${BMS_JOB_TOKEN}
      BMS_CHECKOUT_SECRET: ${BMS_CHECKOUT_SECRET:-${JWT_SECRET}}
      REALTIME_OUTBOX_BATCH_SIZE: ${REALTIME_OUTBOX_BATCH_SIZE:-100}
      REALTIME_OUTBOX_LEASE_MS: ${REALTIME_OUTBOX_LEASE_MS:-30000}
      REALTIME_OUTBOX_MAX_ATTEMPTS: ${REALTIME_OUTBOX_MAX_ATTEMPTS:-12}
      REALTIME_OUTBOX_BASE_RETRY_MS: ${REALTIME_OUTBOX_BASE_RETRY_MS:-500}
      REALTIME_OUTBOX_DISPATCH_ENABLED: ${REALTIME_OUTBOX_DISPATCH_ENABLED:-1}
      REALTIME_OUTBOX_POLL_MS: ${REALTIME_OUTBOX_POLL_MS:-250}
      REALTIME_RETENTION_SECONDS: ${REALTIME_RETENTION_SECONDS:-604800}
      REALTIME_FAILED_RETENTION_SECONDS: ${REALTIME_FAILED_RETENTION_SECONDS:-2592000}
      WS_TICKET_TTL_SECONDS: ${WS_TICKET_TTL_SECONDS:-60}
      # Mail provider switch (sendgrid ค่า default / gmail = ส่งผ่าน Gmail SMTP แทน) — ดู lib/mailer.ts
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      GMAIL_SMTP_USER: ${GMAIL_SMTP_USER}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD}
      GMAIL_SMTP_FROM_NAME: ${GMAIL_SMTP_FROM_NAME}
      PHARMACY_INTAKE_ENABLED: ${PHARMACY_INTAKE_ENABLED}
      PHARMACY_AI_ENABLED: ${PHARMACY_AI_ENABLED}
      PHARMACY_PROTOCOLS_ENABLED: ${PHARMACY_PROTOCOLS_ENABLED}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      # Keep Linux dependencies and Next.js manifests out of the macOS bind mount.
      # Sharing either directory with a host-side dev server corrupts native packages
      # and can produce App Router `clientModules` errors across every route.
      - web_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
      - ./packages:/app/packages
      - ./storage:/app/storage

  caddy:
    ports:
      - "443:443"

volumes:
  web_node_modules:
  web_next_cache:
